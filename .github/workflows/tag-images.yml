name: Tag new Drive images

on:
  schedule:
    - cron: "17 * * * *"   # every hour
  workflow_dispatch:         # "Run workflow" button in the Actions tab
    inputs:
      mode:
        description: "count = just count images (free); tag = index and tag"
        type: choice
        options: [tag, count]
        default: tag
      retag_all:
        description: "Re-tag every image (only after changing tagger/config.yaml)"
        type: boolean
        default: false

concurrency:
  group: tagger
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run tagger
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_IDS: ${{ secrets.DRIVE_FOLDER_IDS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAG_MODEL: ${{ vars.TAG_MODEL }}
          MAX_IMAGES_PER_RUN: ${{ vars.MAX_IMAGES_PER_RUN }}
          RETAG_ALL: ${{ inputs.retag_all }}
        run: |
          if [ "${{ inputs.mode }}" = "count" ]; then
            python -m tagger --count
          else
            python -m tagger
          fi
