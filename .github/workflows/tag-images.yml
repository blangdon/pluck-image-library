name: Tag new Drive images

on:
  schedule:
    - cron: "17 * * * *"   # every hour
  workflow_dispatch:         # "Run workflow" button in the Actions tab
    inputs:
      mode:
        description: "tag = index and tag; count = just count images (free); compare = Sonnet vs Haiku on 50 images (under $1); faces = face search only; rematch = re-run people matching only"
        type: choice
        options: [tag, count, count-videos, compare, faces, rematch]
        default: tag
      limit:
        description: "Most images to tag in this run (blank = default 400)"
        required: false
        default: ""
      retag_all:
        description: "Re-tag every image (only after changing tagger/config.yaml)"
        type: boolean
        default: false

concurrency:
  group: tagger
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run tagger
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_IDS: ${{ secrets.DRIVE_FOLDER_IDS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAG_MODEL: ${{ vars.TAG_MODEL }}
          MAX_IMAGES_PER_RUN: ${{ inputs.limit || vars.MAX_IMAGES_PER_RUN }}
          RETAG_ALL: ${{ inputs.retag_all }}
        run: |
          if [ "${{ inputs.mode }}" = "faces" ] || [ "${{ inputs.mode }}" = "rematch" ]; then
            echo "Skipping AI tagging in ${{ inputs.mode }} mode."
          elif [ "${{ inputs.mode }}" = "count-videos" ]; then
            python -m tagger --count-videos
          elif [ "${{ inputs.mode }}" = "count" ]; then
            python -m tagger --count
          elif [ "${{ inputs.mode }}" = "compare" ]; then
            python -m tagger --compare 50
          else
            python -m tagger
          fi
      - name: Find people (face search)
        if: ${{ !cancelled() && inputs.mode != 'count' && inputs.mode != 'count-videos' && inputs.mode != 'compare' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_IDS: ${{ secrets.DRIVE_FOLDER_IDS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          MAX_IMAGES_PER_RUN: ${{ inputs.limit || vars.MAX_IMAGES_PER_RUN }}
        run: |
          if [ "${{ inputs.mode }}" = "rematch" ]; then
            python -m tagger.faces --rematch
          else
            python -m tagger.faces
          fi
      - name: Save comparison report
        if: ${{ inputs.mode == 'compare' }}
        uses: actions/upload-artifact@v4
        with:
          name: comparison-report
          path: comparison-report.html
