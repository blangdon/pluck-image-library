  - file: shaker-zesty-garlic-old-in-use.jpg
    caption: The dark green can in this photo is a Pluck shaker in the older label design (Zesty Garlic). The food is not part of the reference.
  - file: pouch-original-new.png
    caption: Pluck stand-up pouch (sachet), current label design (Original).
  - file: pouch-original-old-in-use.jpg
